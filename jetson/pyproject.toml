[project]
name = "jetson-torch-build"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
classifiers = []
dependencies = [
    "setuptools==84.2.1",
    "wheel==0.48.0",
    "cmake==4.4.4",
    "ninja==1.13.2",
    "numpy>=2.2,<2.6",
    "packaging==26.3",
    "pyyaml==6.0.3",
    "requests",
    "six",
    "typing-extensions==4.16.0",
    "filelock==4.2.4",
    "fsspec==2026.9.0",
    "jinja2==3.1.6",
    "networkx>=3.4,<3.8",
    "sympy==1.14.0",
    "mpmath==1.3.0",
    "scikit-build-core==1.1.1",
    "pillow==13.0.0",
    "expecttest",
]

[dependency-groups]
dev = ["spin", "lintrunner", "uv==0.13.7"]

[tool.uv]
package = false
required-version = ">=0.13.7"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
